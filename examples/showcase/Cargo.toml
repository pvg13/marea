[package]
name = "showcase"
description = "marea framework showcase: AppShell + NavShell + component gallery, wired to the real PocketBase"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
dioxus = { workspace = true }
marea-auth = { path = "../../crates/marea-auth", features = ["dioxus", "pairing"] }
# Every feature is on because exercising them is this example's job — a real
# app enables `pairing` only if it offers QR login, and `android-back` only if
# it ships an Android build whose MainActivity calls into it.
marea-ui = { path = "../../crates/marea-ui", features = [
    "pairing",
    "android-back",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus-sdk-storage = { workspace = true }

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]
mobile = ["dioxus/mobile"]
