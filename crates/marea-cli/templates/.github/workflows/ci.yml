name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          {%- if web %}
          targets: wasm32-unknown-unknown
          {%- endif %}

      - uses: Swatinem/rust-cache@v2

      # Desktop builds link against the system webview.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libxdo-dev

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      {%- if web %}

      - name: Browser build compiles
        run: cargo check -p ui{% if wavesync %} -p data{% endif %} --target wasm32-unknown-unknown
      {%- endif %}

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Two resolutions of the same crate are two distinct sets of types, so a
      # context provided by one is invisible to the other — and it fails at
      # runtime, not here. Note this checks specific crates rather than
      # asserting `cargo tree -d` is empty: it never is, because the dioxus
      # desktop stack carries dozens of harmless duplicate leaves.
      - name: One copy of each shared crate
        run: |
          dupes=$(cargo tree --duplicates || true)
          failed=0
          for crate in wavesyncdb dioxus sea-orm dioxus-sdk-storage; do
            if echo "$dupes" | grep -qE "^$crate v"; then
              echo "::error::$crate resolves more than once"
              echo "$dupes" | grep -A6 -E "^$crate v"
              failed=1
            fi
          done
          exit $failed

      # `domain` is the part of the app that survives a rewrite of everything
      # else. It stops being that the moment it can reach a widget or a table.
      - name: domain stays pure
        run: |
          tree=$(cargo tree -p domain --prefix none)
          failed=0
          for crate in dioxus sea-orm{% if wavesync %} wavesyncdb{% endif %}; do
            if echo "$tree" | grep -qE "^\s*$crate v"; then
              echo "::error::domain depends on $crate"
              failed=1
            fi
          done
          exit $failed

      # One target check in a screen is how an app ends up with two view
      # layers. {% if wavesync %}The capability belongs in `data`, behind a repository that is
      # the same API on both sides.{% endif %} Comment lines are excluded so the rule can
      # be documented in the code it governs.
      - name: ui has no target cfg
        run: |
          if grep -rnE '^[^/*]*#\[cfg(_attr)?\((not\()?target_arch' crates/ui/src; then
            echo "::error::target-conditional code in crates/ui/src"
            exit 1
          fi
