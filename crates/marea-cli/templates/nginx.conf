server {
    listen 80;
    root /usr/share/nginx/html;

    # Dioxus router owns every path: the client-side router resolves the URL,
    # so anything that is not a real file must return index.html rather than a
    # 404. Without this, a deep link or a page refresh anywhere but `/` breaks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable; index.html must never be cached or a deploy
    # leaves browsers on the previous wasm bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/wasm;
    gzip_min_length 1024;
}
