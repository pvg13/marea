[package]
name = "marea-cli"
description = "Scaffolding CLI for marea apps: generates a domain/data/ui/app-* workspace from a set of selected options"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "marea"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
include_dir = "0.7.4"
inquire = "0.9.4"
minijinja = "2.24.0"
serde = { workspace = true }
thiserror = { workspace = true }
toml = "1.1.4"
toml_edit = "0.25"
