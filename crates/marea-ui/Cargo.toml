[package]
name = "marea-ui"
description = "Dioxus UI layer for marea apps: app shell, adaptive navigation, component library, toasts, theme and auth screens"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Phone→web QR pairing screens (PairScreen on web, scanner hook on mobile).
pairing = ["marea-auth/pairing"]

[dependencies]
dioxus = { workspace = true }
dioxus-sdk-storage = { workspace = true }
marea-auth = { path = "../marea-auth", features = ["dioxus"] }
serde = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }

[dev-dependencies]
dioxus-ssr = "0.7"
