[package]
name = "marea-ui"
description = "Dioxus UI layer for marea apps: app shell, adaptive navigation, component library, toasts, theme and auth screens"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Camera code scanner: live `<video>` feed + `BarcodeDetector` polling, with a
# vendored ZXing-JS polyfill on iOS (WebKit has no BarcodeDetector). Usable on
# its own for barcode scanning; `pairing` builds its QR takeover on it.
scanner = []
# Phone→web QR pairing screens: `PairScreen` (web) + `PairDeviceSection` (native).
pairing = ["scanner", "dep:qrcode", "marea-auth/pairing"]
# Android system back gesture → router. Opt-in rather than always-on for
# Android: it exports a fixed JNI symbol
# (`Java_dev_dioxus_main_MainActivity_onBack`), so an app that wants to own
# back handling itself would otherwise hit a duplicate-symbol link error with
# no way to opt out.
android-back = []
# Local scheduled reminders: notifications the device posts to itself, with no
# server anywhere. Opt-in because it bundles a Gradle submodule (two broadcast
# receivers plus the manifest entries they need) into every Android build that
# turns it on, and because it declares RECEIVE_BOOT_COMPLETED — neither belongs
# in an app that never schedules anything.
local-notify = ["dep:serde_json", "dep:manganis"]
# The URL the app was opened with, delivered to the router. Opt-in for
# `android-back`'s reason: it exports a fixed JNI symbol
# (`Java_dev_dioxus_main_MainActivity_onDeeplink`), so an app that wants to
# handle its own intents would otherwise hit a duplicate-symbol link error with
# no way out.
deeplink = []

[dependencies]
dioxus = { workspace = true }
dioxus-sdk-storage = { workspace = true }
marea-auth = { path = "../marea-auth", features = ["dioxus"] }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
log = { workspace = true }

# Only `local-notify` uses it, and only on Android — but `#[manganis::ffi]`
# is a macro the crate must be able to name at expansion time, so it is a
# plain optional dependency rather than a target-scoped one.
manganis = { version = "0.7.6", optional = true }

# QR *generation* for the pairing tile. Spec must stay byte-identical to
# MediterraneaDiente's (`packages/ui/Cargo.toml`) — see the workspace manifest's
# note on duplicate resolutions.
qrcode = { version = "0.14", default-features = false, features = [
    "svg",
], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }

# Only the `android-back` feature uses this, but Cargo can't express
# "optional dep of a target-specific table gated on a feature" — target
# tables don't take `optional` + feature activation the way the main table
# does. Scoping it to Android instead keeps it out of every other build,
# which is the cost that actually mattered.
[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }
# The Activity's `JavaVM` and `Context`, which `local-notify` needs to reach
# the Kotlin half. Scoped to Android for the same reason `jni` is: Cargo
# cannot express "optional dependency of a target table, gated on a feature".
ndk-context = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
# `Date.now()` for the pairing poll deadline — `std::time::Instant` panics on
# wasm32-unknown-unknown. Unconditional (not feature-gated) because marea-auth
# already pulls it on this target, so it costs nothing to keep the cfg simple.
js-sys = "0.3"

[dev-dependencies]
dioxus-ssr = "0.7"

# Guards the default `cargo test -p marea-ui` (no features) from trying to
# compile a suite whose modules aren't in the crate.
[[test]]
name = "pairing_ssr"
required-features = ["pairing"]

[[test]]
name = "back_gesture_ssr"
required-features = ["android-back"]
