[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.9", features = ["router"] }
# TODO(marea): switch to { git = "…", tag = "v0.1.0" } once published.
marea-auth = { path = "../dioxus/crates/marea-auth", features = ["dioxus"] }
marea-ui = { path = "../dioxus/crates/marea-ui" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus-sdk-storage = { git = "https://github.com/DioxusLabs/sdk.git", rev = "15525043cadc3c467afb15888ce804bdc9b6a46e" }

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
web = ["dioxus/web"]
